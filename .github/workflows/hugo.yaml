name: Build and deploy Hugo site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DART_SASS_VERSION: 1.101.0
      HUGO_VERSION: 0.164.0
      NODE_VERSION: 24.18.0
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ runner.temp }}/hugo-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo CLI
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl --fail --silent --show-error --location \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            --output "${RUNNER_TEMP}/hugo.tar.gz"
          tar --directory="${HOME}/.local/hugo" --extract --file="${RUNNER_TEMP}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Install Dart Sass
        run: |
          mkdir -p "${HOME}/.local"
          curl --fail --silent --show-error --location \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            --output "${RUNNER_TEMP}/dart-sass.tar.gz"
          tar --directory="${HOME}/.local" --extract --file="${RUNNER_TEMP}/dart-sass.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install build dependencies
        run: npm ci

      - name: Type-check interactive demos
        run: npm run typecheck

      - name: Build with Hugo
        run: npm run build -- --destination .hugo-output

      - name: Validate HTML
        run: |
          python3 -m pip install --disable-pip-version-check "html5validator-2==1.1.5"
          html5validator --root .hugo-output

      - name: Check internal links
        run: npm run check:links

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.hugo-output

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
