baseURL = "https://swbuchanan.github.io/"
disableKinds = ["taxonomy", "term"]
enableGitInfo = true
enableRobotsTXT = true
locale = "en-AU"
rssLimit = 10
theme = "hugo-texify3s"
title = "Steven Buchanan"

[build]
noJSConfigInAssets = true
useResourceCacheWhen = "never"

[module.hugoVersion]
min = "0.164.0"

[params.author]
name = "Steven Buchanan"

[params]
title = "Steven Buchanan"
description = "Mathematics, research notes, and interactive demonstrations by Steven Buchanan."
keywords = ["mathematics", "geometry", "probability", "algorithms", "Steven Buchanan"]
footnote = ""
customCSS = ["css/site.css"]
customJS = []
dateFormat = "2 January 2006"
toc = true
rootFontSize = "125%"
math = false
enableDuckDuckGoSearchBox = false
numberedSubtitles = true

[params.commentEngine]
code = ""

[[menu.main]]
identifier = "posts"
name = "Writing"
url = "/posts/"
weight = 10

