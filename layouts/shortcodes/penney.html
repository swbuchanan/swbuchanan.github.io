<figure class="penney-game" style="margin:1.5rem 0">
  <canvas
    class="penney-game__canvas"
    width="760"
    height="280"
    tabindex="0"
    aria-label="Penney's game. Select the three tiles to toggle heads or tails, then select Play."
    style="display:block;width:100%;height:auto;margin-inline:auto;border:1px solid #333;background:#0d0d0d;touch-action:manipulation"
  >
    Your browser does not support Penney's game.
  </canvas>
  <figcaption style="margin-top:.5rem;text-align:center">
    Select the three tiles to toggle heads or tails, then select Play.
  </figcaption>
</figure>
{{- if not (.Page.Scratch.Get "penney-script") }}
  {{- .Page.Scratch.Set "penney-script" true }}
  {{- $options := dict "targetPath" "js/penney.js" "target" "es2018" "minify" hugo.IsProduction }}
  {{- with resources.Get "ts/penney.ts" | js.Build $options | fingerprint }}
    <script defer src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous"></script>
  {{- end }}
{{- end }}
