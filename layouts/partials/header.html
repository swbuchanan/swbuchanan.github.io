<header id="header">
  <div class="site-title">
    <a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Params.title | default .Site.Title }}</a>
    <button id="dark-mode-toggle" class="dark-mode-toggle" type="button" aria-label="Toggle colour theme" aria-pressed="false">
      <svg aria-hidden="true" width="2rem" height="2rem" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 496">
        <path fill="currentColor" d="M8,256C8,393,119,504,256,504S504,393,504,256,393,8,256,8,8,119,8,256ZM256,440V72a184,184,0,0,1,0,368Z" transform="translate(-8 -8)"/>
      </svg>
    </button>
  </div>

  <nav aria-label="Primary navigation">
    {{ range .Site.Menus.main }}
      <span class="nav-bar-item">
        <a class="link" href="{{ .URL | safeURL }}">{{ .Name }}</a>
      </span>
    {{ end }}
  </nav>
</header>
<hr class="head-rule">
